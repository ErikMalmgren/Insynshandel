# §10.4 — two services, no orchestration.
#
#   docker compose up -d api                       # the always-on reader
#   docker compose run --rm cli insyn ingest recent --days 7
#   docker compose run --rm cli insyn build
#   docker compose run --rm cli insyn export-static --out /data/dist
#
# The `cli` service is driven by the HOST scheduler (a systemd timer — see
# deploy/systemd/), not a long-lived container running its own cron (§10.4
# rule 3). It has profile `cli` so `docker compose up` never starts it.

services:
  api:
    build: .
    restart: unless-stopped
    # Bind to loopback only; the host's Caddy/nginx terminates TLS and proxies
    # in (§10.4). Never expose uvicorn straight to the internet.
    ports: ["127.0.0.1:8000:8000"]
    # Bind mount to the host's LOCAL disk — §10.2.2: SQLite WAL corrupts on
    # NFS/SMB. NOT a named volume (rule 1: a rebuild must not lose the DB).
    volumes: ["./data:/data"]
    environment:
      # The frontend origin(s), comma-separated. NEVER "*" (§1.2). Change this
      # to your real GitHub Pages / custom-domain host.
      INSYN_CORS_ORIGINS: "https://erikmalmgren.github.io"

  cli:
    build: .
    profiles: ["cli"]          # excluded from `docker compose up`
    volumes: ["./data:/data"]
    environment:
      OPENFIGI_API_KEY: "${OPENFIGI_API_KEY:-}"   # optional; raises the FIGI rate limit
    # neutral entrypoint — the scheduler passes the subcommand
    # (`ingest recent`, `build`, `export-static`, `doctor`, …).
    entrypoint: ["uv", "run", "insyn"]

[project]
name = "insynshandel"
version = "0.1.0"
description = "Swedish insider-trading data (FI insynsregistret) → SQLite → static JSON"
readme = "README.md"
authors = [
    { name = "Erik Malmis", email = "e.malmis@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "pydantic",
    "yfinance",
    "requests",
    "tzdata>=2026.3",
]

[project.scripts]
insyn = "insynshandel.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
